# rattler-build recipe, modular-community shape.
# Build locally: rattler-build build -r recipe.yaml -c https://conda.modular.com/max -c conda-forge
context:
  version: 0.1.0

package:
  name: "mojo-mmap"
  version: ${{ version }}

source:
  - path: .

build:
  number: 0
  script:
    - mojo precompile src/mmap -o ${{ PREFIX }}/lib/mojo/mmap.mojoc

requirements:
  host:
    - mojo-compiler >=1.2.0,<1.3
  build:
    - mojo-compiler >=1.2.0,<1.3
  run:
    - ${{ pin_compatible('mojo-compiler') }}

tests:
  - script:
    - if: unix
      then:
        - mojo build -I src examples/quickstart.mojo -o quickstart
    files:
      source:
        - src/
        - examples/

about:
  homepage: https://github.com/amarbaro/mojo-mmap
  license: Apache-2.0
  license_file: LICENSE
  summary: Memory-mapped files for Mojo
  repository: https://github.com/amarbaro/mojo-mmap

extra:
  maintainers:
    - amarbaro.org
  project_name:
    - mojo-mmap
