[project]
name = "mojo-mmap"
version = "0.1.0"
description = "Memory-mapped files for Mojo: zero-copy Span views, read and write, madvise, msync"
license = "Apache-2.0"
requires-python = ">=3.11,<3.15"
dependencies = ["mojo>=1.2.0,<1.3"]

[project.urls]
Homepage = "https://github.com/amarbaro/mojo-mmap"
Repository = "https://github.com/amarbaro/mojo-mmap"
